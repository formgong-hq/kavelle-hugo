{{- $c := hugo.Data.content -}}
<!doctype html>
<html lang="{{ $c.site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ $c.site.title }}{{ else }}{{ .Title }} · {{ $c.site.name }}{{ end }}</title>
<meta name="description" content="{{ $c.site.description }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121414'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2334c49a' stroke-width='1.6'/%3E%3Cpath d='M12 9v14M12 16l7-7M12 16l7 7' fill='none' stroke='%2334c49a' stroke-width='1.6'/%3E%3C/svg%3E">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
<link rel="stylesheet" href="{{ "site.css" | relURL }}">
</head>
<body>
{{ partial "sections/header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "sections/footer.html" . }}
<script src="{{ "site.js" | relURL }}" defer></script>
</body>
</html>
